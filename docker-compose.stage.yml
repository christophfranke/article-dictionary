version: '3'

services:
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend-dist:/app/frontend/dist
    command: npm run build

  backend:
    build:
      context: ./python
      dockerfile: backend.Dockerfile
    depends_on:
      - mongodb
    command: gunicorn --capture-output --enable-stdio-inheritance -c /app/backend/gunicorn_config.py main:app

  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - ./database/mongodb:/data/db
    command: mongod --quiet --logpath /dev/null

  backup:
    build:
      context: ./database
      dockerfile: backup.Dockerfile
    volumes:
      - ./database/backups:/backups
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    depends_on:
      - mongodb

  scheduler:
    build:
      context: ./python
      dockerfile: scheduler.Dockerfile
    depends_on:
      - mongodb

  webserver:
    build:
      context: ./nginx
    volumes:
      - frontend-dist:/usr/share/nginx/html
    ports:
      - "9300:80" # change this to 80:80 for real live
    depends_on:
      - frontend-build
      - backend

volumes:
  frontend-dist:
