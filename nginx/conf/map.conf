map $uri $is_whitelist_route {
    default 0;

    # Exact matches
    / 1;
    /home 1;
    /login 1;
    /register 1;
    /password-reset 1;
    /profile 1;
    /create 1;

    # Pattern matches with regex inside map (only in newer nginx versions)
    ~^/dictionary(/review)?$ 1;
    ~^/dictionary/[^/]+$ 1;
    ~^/articles$ 1;
    ~^/articles/import/[^/]+$ 1;
    ~^/articles/[^/]+(/edit|/review)?$ 1;
}