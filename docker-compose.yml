version: '3'

services:
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend-dist:/app/frontend/dist
    command: npm run build

  backend:
    build:
      context: ./python
      dockerfile: backend.Dockerfile
    depends_on:
      - mongodb
    command: gunicorn --capture-output --enable-stdio-inheritance -c /app/backend/gunicorn_config.py main:app
    restart: always

  backup:
    build:
      context: ./database
      dockerfile: backup.Dockerfile
    volumes:
      - ./database/backups:/backups
      - ./database/uploads:/uploads
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - ./data:/root/data/db
    command: mongod --quiet --logpath /dev/null
    restart: always

  scheduler:
    build:
      context: ./python
      dockerfile: scheduler.Dockerfile
    depends_on:
      - mongodb
    restart: always

  webserver:
    build:
      context: ./nginx
    volumes:
      - frontend-dist:/usr/share/nginx/html
    ports:
      - "80:80"
    depends_on:
      - frontend-build
      - backend
    restart: always

volumes:
  frontend-dist:
