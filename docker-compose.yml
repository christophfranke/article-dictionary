version: '3'

services:
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend-dist:/app/frontend/dist
    command: npm run build

  backend:
    build:
      context: ./python
      dockerfile: backend.Dockerfile
    env_file:
      - .env.mongodb
    depends_on:
      - mongodb
    command: gunicorn --capture-output --enable-stdio-inheritance -c /app/backend/gunicorn_config.py main:app
    restart: always

  backup:
    build:
      context: ./database
      dockerfile: backup.Dockerfile
    env_file:
      - .env.mongodb
    volumes:
      - /database/backups:/backups
      - /database/uploads:/uploads
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - /database/mongodb:/data/db
    command: mongod --quiet --logpath /dev/null
    restart: always

  scheduler:
    build:
      context: ./python
      dockerfile: scheduler.Dockerfile
    env_file:
      - .env.mongodb
    depends_on:
      - mongodb
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - acme-challenge:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - webserver
    entrypoint: '/bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done;"'

  webserver:
    build:
      context: ./nginx
    volumes:
      - acme-challenge:/var/www/certbot
      - frontend-dist:/usr/share/nginx/html
      - nginx-conf:/etc/nginx/conf.d
      - letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend-build
      - backend
    restart: always

volumes:
  frontend-dist:
  acme-challenge:
  nginx-conf:
  letsencrypt:
